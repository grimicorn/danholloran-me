name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Exclude draft posts from Prettier
        run: |
          grep -rl "^draft: true" .vitepress/content/posts/ 2>/dev/null \
            >> .prettierignore || true

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci
