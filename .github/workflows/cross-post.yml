name: Cross-Post Blog Posts

on:
  push:
    branches: [main]
    paths:
      - ".vitepress/content/posts/**"
  workflow_dispatch:
    inputs:
      post_slug:
        description: "Specific post slug to publish (filename without extension)"
        required: false

jobs:
  cross-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # needed to detect new/changed files

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Detect new posts
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.post_slug }}" ]; then
            echo "posts=${{ github.event.inputs.post_slug }}" >> $GITHUB_OUTPUT
          else
            # Get markdown files added or modified in this push
            NEW=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- '.vitepress/content/posts/*.md' | xargs -I{} basename {} .md | tr '\n' ',')
            echo "posts=$NEW" >> $GITHUB_OUTPUT
          fi

      - name: Cross-post to Dev.to and Hashnode
        if: steps.detect.outputs.posts != ''
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_PAT: ${{ secrets.HASHNODE_PAT }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          SITE_URL: https://danholloran.me
          POST_SLUGS: ${{ steps.detect.outputs.posts }}
        run: node scripts/cross-post.mjs

      - name: Announce on X (Twitter)
        if: steps.detect.outputs.posts != ''
        env:
          X_APP_KEY: ${{ secrets.X_APP_KEY }}
          X_APP_SECRET: ${{ secrets.X_APP_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SITE_URL: https://danholloran.me
          POST_SLUGS: ${{ steps.detect.outputs.posts }}
        run: node scripts/announce-x.mjs
