name: Cross-Post Blog Posts

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - ".vitepress/content/posts/**"
  workflow_dispatch:
    inputs:
      post_slug:
        description: "Specific post slug to publish (filename without extension)"
        required: false

jobs:
  cross-post:
    # Publish only when a PR is actually merged into main (not merely closed),
    # or when dispatched manually. Triggering on the merge event — rather than
    # every push to main — keeps cross-posting off direct pushes and local
    # reconciliation merge commits, which otherwise re-detect an already-live
    # post and fail with a Dev.to 422 (canonical URL already taken).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # The merge commit that landed on main (empty on manual dispatch, which
          # falls back to the default branch). fetch-depth 0 gives us the full
          # history needed to diff the PR's base..head range.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Detect new posts
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.post_slug }}" ]; then
            echo "posts=${{ github.event.inputs.post_slug }}" >> $GITHUB_OUTPUT
          else
            # Posts this PR added or modified (three-dot = changes on the PR
            # branch since it diverged from main).
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            if [ -z "$BASE" ]; then BASE="HEAD~1"; HEAD="HEAD"; fi
            NEW=$(git diff --name-only --diff-filter=AM "$BASE...$HEAD" -- '.vitepress/content/posts/*.md' | xargs -I{} basename {} .md | tr '\n' ',')
            echo "posts=$NEW" >> $GITHUB_OUTPUT
          fi

      - name: Filter draft posts
        id: filter
        run: |
          NON_DRAFT=""
          for slug in $(echo "${{ steps.detect.outputs.posts }}" | tr ',' '\n'); do
            file=".vitepress/content/posts/${slug}.md"
            if [ -f "$file" ] && ! grep -q "^draft: true" "$file"; then
              NON_DRAFT="${NON_DRAFT}${slug},"
            fi
          done
          echo "posts=${NON_DRAFT}" >> $GITHUB_OUTPUT

      - name: Cross-post to Dev.to
        if: steps.filter.outputs.posts != ''
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          SITE_URL: https://danholloran.me
          POST_SLUGS: ${{ steps.filter.outputs.posts }}
        run: node scripts/cross-post.mjs
