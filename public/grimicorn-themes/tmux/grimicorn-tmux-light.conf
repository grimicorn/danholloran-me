# Grimicorn — Light · tmux status theme
# Built from grimicorn-palette.md.
#
#   bg #E4E4E4  bg-alt #F0F0F0  bg-raised #FDFDFD  border #D0D0D0
#   fg #1A262C  muted #3C4C55
#   blue #4A80C8  purple #6B63C8  teal #3A8E96
#   green #2E7D32  yellow #8A8A20  salmon #C4604E
#
# Install: save anywhere, then add to your ~/.tmux.conf:
#   source-file ~/path/to/grimicorn-tmux-light.conf
# Reload with: tmux source-file ~/.tmux.conf

set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#E4E4E4,fg=#1A262C"

# Left: session name in a blue pill.
set -g status-left-length 40
set -g status-left "#[bg=#4A80C8,fg=#FFFFFF,bold] #S #[bg=#E4E4E4,fg=#1A262C,nobold] "

# Right: date in a panel, time in a blue pill.
set -g status-right-length 80
set -g status-right "#[bg=#F0F0F0,fg=#3A8E96] %a %d %b #[bg=#4A80C8,fg=#FFFFFF,bold] %H:%M "

# Windows: inactive on the panel background, current raised + blue.
set -g window-status-separator ""
set -g window-status-format "#[bg=#F0F0F0,fg=#3C4C55] #I #W "
set -g window-status-current-format "#[bg=#FDFDFD,fg=#4A80C8,bold] #I #[fg=#1A262C]#W "
set -g window-status-activity-style "fg=#8A8A20"
set -g window-status-bell-style "fg=#C4604E,bold"

# Pane borders: border gray, blue when active.
set -g pane-border-style "fg=#D0D0D0"
set -g pane-active-border-style "fg=#4A80C8"

# Command prompt / messages.
set -g message-style "bg=#4A80C8,fg=#FFFFFF,bold"
set -g message-command-style "bg=#F0F0F0,fg=#4A80C8"

# Copy-mode selection.
set -g mode-style "bg=#3A8E96,fg=#FDFDFD"

# Clock mode (prefix + t).
set -g clock-mode-colour "#4A80C8"
set -g clock-mode-style 24

# Pane numbers (prefix + q).
set -g display-panes-colour "#3C4C55"
set -g display-panes-active-colour "#4A80C8"
